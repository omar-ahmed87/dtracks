name = "etracks"
main = "worker.js"
compatibility_date = "2024-04-05"
compatibility_flags = ["nodejs_compat"]

# Serve the frontend directory automatically as static assets
# Any requests to CSS, JS, or images in this directory will be handled by Cloudflare natively
[assets]
directory = "./frontend"

[vars]
# This tells server.js to use precompiled EJS templates and skip app.listen()
CLOUDFLARE_WORKER = "true"
NODE_ENV = "production"

# You will need to set these securely in Cloudflare using:
# npx wrangler secret put SUPABASE_URL
# npx wrangler secret put SUPABASE_SERVICE_KEY
# npx wrangler secret put JWT_SECRET
